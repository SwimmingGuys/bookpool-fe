# 이미지 안에서 정적 SPA만 내려준다.
# TLS·도메인·/api 프록시는 앞단 Caddy가 맡으므로 여기엔 없다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 프록시 뒤라서 실제 클라이언트 IP는 X-Forwarded-For에 있다.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite가 파일명에 해시를 박으므로 영구 캐시해도 안전하다.
    # expires와 add_header를 같이 쓰면 Cache-Control이 두 번 붙는다. 하나로 둔다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html은 절대 캐시하지 않는다.
    # 캐시되면 새 배포 후에도 옛 assets 해시를 가리켜 흰 화면이 된다.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA 딥링크: /recruitments/12 를 새로고침해도 index.html로 폴백.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 컨테이너 헬스체크용
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
